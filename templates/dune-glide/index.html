<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dune Glide</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #9fd6f2;
      color: #241c14;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header, footer {
      position: fixed; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; padding: 12px 16px; pointer-events: none;
    }
    header { top: 0; }
    footer { bottom: 0; justify-content: center; flex-wrap: wrap; }
    .end { display: flex; align-items: center; gap: 8px; pointer-events: none; }
    .chip, button {
      background: rgba(255, 250, 240, 0.94);
      border-radius: 16px;
      padding: 10px 16px;
    }
    h1 { font-size: 1.7rem; margin: 0; line-height: 1.1; }
    p { font-size: 1.15rem; margin: 2px 0 0; }
    #score { font-size: 1.5rem; font-weight: 700; }
    #score.pop { animation: pop 0.28s ease; }
    @keyframes pop { 40% { transform: scale(1.14); } }
    #goal:empty, #card-body:empty { display: none; }
    button {
      pointer-events: auto;
      border: 0;
      min-width: 7.2rem;
      min-height: 4rem;
      font: 700 1.35rem "Trebuchet MS", "Segoe UI", sans-serif;
      color: #241c14;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #0b6e91; outline-offset: 2px; }
    #left, #right { background: #e07a3d; color: #fffaf0; min-width: 8.5rem; }
    #back { background: #3d6f8f; color: #fffaf0; }
    #sound { min-width: 5.6rem; }
    #sound[aria-pressed="false"] { background: #d9d3c7; }
    .card {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: rgba(36, 28, 20, 0.28);
      padding: 16px;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    .card.leaving { opacity: 0; pointer-events: none; }
    .card[hidden] { display: none; }
    .panel {
      background: #fffaf0;
      border-radius: 22px;
      padding: 28px 28px 22px;
      text-align: center;
      max-width: 28rem;
      width: min(28rem, 100%);
    }
    .panel h2 { font-size: 2.3rem; margin: 0 0 8px; }
    .panel p { font-size: 1.3rem; margin: 0 0 18px; }
    .panel button { background: #e07a3d; color: #fffaf0; min-width: 9rem; }
  </style>
</head>
<body>
  <header>
    <div class="chip">
      <h1 id="title">Dune Glide</h1>
      <p id="goal"></p>
    </div>
    <div class="end">
      <button type="button" id="sound" aria-pressed="true">Sound</button>
      <div class="chip" id="score">Shells 0</div>
    </div>
  </header>
  <canvas id="view"></canvas>
  <footer>
    <button type="button" id="left">Left</button>
    <button type="button" id="back">Back</button>
    <button type="button" id="pause">Pause</button>
    <button type="button" id="right">Right</button>
  </footer>
  <div class="card" id="card">
    <div class="panel">
      <h2 id="card-title">Dune Glide</h2>
      <p id="card-body"></p>
      <button type="button" id="card-go">Go</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
